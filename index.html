const RESERV_BACKEND_URL='https://script.google.com/macros/s/AKfycbwIKDpm_FxIZWuvkx3p3UOWrHY0IEneV4UY0D_Xv_qlMYdl2rAbT-MurXtphNCNYYY45A/exec';

async function gasCall(name,...args){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);

  try{
    const body=new URLSearchParams();
    body.set('action',name);
    body.set('args',JSON.stringify(args));

    const response=await fetch(RESERV_BACKEND_URL,{
      method:'POST',
      body,
      signal:controller.signal,
      redirect:'follow',
      cache:'no-store'
    });

    const text=await response.text();
    let data;
    try{ data=JSON.parse(text); }
    catch(e){ throw new Error('Resposta inválida do servidor Reserv.'); }

    if(!data.ok)throw new Error(data.error||'Erro no servidor Reserv');
    return data.result;
  }catch(err){
    if(err&&err.name==='AbortError')throw new Error('O servidor demorou para responder. Tente novamente.');
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

    const slug=(new URLSearchParams(location.search).get('empresa')||new URLSearchParams(location.search).get('agendar')||window.__RESERV_INITIAL_COMPANY_SLUG||'').trim();
    if(slug){
      const b=await gasCall('getBusinessBySlug',slug);

        state.business=b;
        state.pendingCompanySlug=slug;
        state.mode=null;
        state.route='clientLogin';
        saveLocalOnly();
        return true;

    if(state.sessionToken){
      const restored=await gasCall('restoreSession',state.sessionToken);
      if(restored?.type==='business'){
        state.mode='business';
        state.business=restored.business;
        state.bookings=restored.bookings||[];

    }
    return true;
  }catch(err){
    console.warn('Reserv cloud restore:',err);
    state.sessionToken='';
    saveLocalOnly();
    return false;
  }
}

function compressImageFile(file,maxWidth=900,maxHeight=900,quality=.75){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Falha ao ler imagem'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Imagem inválida'));
      img.onload=()=>{
        const ratio=Math.min(1,maxWidth/img.naturalWidth,maxHeight/img.naturalHeight);
        const w=Math.max(1,Math.round(img.naturalWidth*ratio));
        const h=Math.max(1,Math.round(img.naturalHeight*ratio));
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        let data=canvas.toDataURL('image/webp',quality);
        if(!data.startsWith('data:image/webp')) data=canvas.toDataURL('image/jpeg',quality);
        resolve(data);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function formatServiceDuration(service){
  const mins=Number(service.duration||0);
  if(!mins)return 'Tempo não informado';
  if(mins%60===0){const h=mins/60;return `${h} ${h===1?'hora':'horas'}`;}
  if(mins>60){const h=Math.floor(mins/60),m=mins%60;return `${h}h ${m}min`;}
  return `${mins} min`;
}
function normalizeWhatsappNumber(value){
  let digits=String(value||'').replace(/\D/g,'');
  if(!digits)return '';
  if(digits.length===10||digits.length===11)digits='55'+digits;
  return digits;
}
function whatsappUrl(phone,message){

    '<div class="booking-modal-actions"><button type="button" class="secondary-btn booking-modal-back">Voltar</button><button type="button" class="primary-btn booking-reschedule-confirm">Salvar reagendamento</button></div>'+
  '</div>';

  document.body.appendChild(modal);

  const close=()=>modal.remove();
  modal.querySelector('.booking-modal-close').onclick=close;
  modal.querySelector('.booking-modal-back').onclick=close;
  modal.addEventListener('click',e=>{if(e.target===modal)close();});

  modal.querySelector('.booking-reschedule-confirm').onclick=()=>{
    const newDate=modal.querySelector('#rescheduleDate').value;
    const newTime=modal.querySelector('#rescheduleTime').value;
    const note=(modal.querySelector('#rescheduleNote').value||'').trim();

    if(!newDate||!newTime){showToast('Informe a nova data e horário');return;}

    const conflict=state.bookings.some((x,j)=>
      j!==index &&
      bookingStatus(x)!=='cancelled' &&
      x.date===newDate &&
      x.time===newTime &&
      x.professional?.name===b.professional?.name
    );

    if(conflict){showToast('Esse horário já está ocupado para o profissional');return;}

    const booking=state.bookings[index];
    if(!booking)return;

    booking.previousDate=booking.date;
    booking.previousTime=booking.time;
    booking.date=newDate;
    booking.time=newTime;
    booking.status='rescheduled';
    booking.rescheduleNote=note;
    booking.cancelReason='';
    booking.whatsappNotification={
      type:'booking_rescheduled',
      pending:true,
      sent:false,
      oldDate:booking.previousDate,
      oldTime:booking.previousTime,
      newDate,
      newTime,
      note
    };
    booking.updatedAt=Date.now();
    pushClientNotification('rescheduled',booking);

    save();
    if(CLOUD_MODE&&booking.id){
      gasCall('updateBooking',state.sessionToken,booking.id,{

        date:booking.date,time:booking.time,

        rescheduleNote:booking.rescheduleNote,cancelReason:''

    close();
    render();
    showToast('Agendamento reagendado');
    setTimeout(()=>openWhatsappMessage(booking.clientWhatsapp,rescheduleWhatsappMessage(booking)),120);

    <div class="delete-account-actions">
      <button type="button" class="secondary-btn" data-delete-close>Cancelar</button>
      <button type="button" class="danger-btn" data-delete-confirm="${type}" disabled>Excluir conta</button>
    </div>
  </div>`;

  document.body.appendChild(modal);

  const check=modal.querySelector('#deleteAccountCheck');
  const confirmBtn=modal.querySelector('[data-delete-confirm]');
  const close=()=>modal.remove();

  modal.querySelector('[data-delete-close]').onclick=close;
  modal.addEventListener('click',e=>{if(e.target===modal)close();});
  check.addEventListener('change',()=>{confirmBtn.disabled=!check.checked;});

  confirmBtn.addEventListener('click',()=>{
    if(!check.checked)return;

    if(type==='client'){
      const client=getCurrentClient();
      if(!client){close();return;}

      if(CLOUD_MODE&&state.sessionToken){
        const token=state.sessionToken;
        gasCall('deleteClient',token).then(()=>{
          state.sessionToken='';
          state.clients=state.clients.filter(c=>c.id!==client.id);
          state.currentClientId='';
          state.clientName='';
          state.clientWhatsapp='';
          state.bookings=[];
          state.clientNotifications=[];
          state.mode=null;
          state.route='welcome';
          state.history=[];
          saveLocalOnly();
          close();render();showToast('Conta excluída');
        }).catch(cloudError);
        return;
      }

      const clientId=client.id;
      state.bookings=state.bookings.filter(b=>{
        const bid=b.clientId||clientIdFromWhatsapp(b.clientWhatsapp);
        return bid!==clientId;
      });
      state.clientNotifications=state.clientNotifications.filter(n=>n.clientId!==clientId);
      state.clients=state.clients.filter(c=>c.id!==clientId);
      state.currentClientId='';
      state.clientName='';
      state.clientWhatsapp='';
      state.mode=null;
      state.route='welcome';
      state.history=[];
      state.selectedCategory='';
      state.clientSearch='';
      save();
      close();
      render();
      showToast('Conta excluída');
      return;
    }

    if(type==='business'){
      if(CLOUD_MODE&&state.sessionToken){
        const token=state.sessionToken;
        gasCall('deleteBusiness',token).then(()=>{
          clearRememberedBusinessSession();
          state.sessionToken='';
          state.business={...defaultBusiness,services:[],professionals:[]};
          state.bookings=[];
          state.mode=null;
          state.route='welcome';
          state.history=[];
          saveLocalOnly();
          close();render();showToast('Conta da empresa excluída');
        }).catch(cloudError);
        return;
      }

      /* Antes de apagar o negócio, remove-o dos favoritos de todos os clientes. */
      const deletedBusinessId=currentBusinessFavoriteId();
      state.clients.forEach(client=>{
        client.favorites=(client.favorites||[]).filter(f=>(typeof f==='string'?f:f.id)!==deletedBusinessId);
      });
      clearRememberedBusinessSession();
      state.business={...defaultBusiness,services:[],professionals:[]};
      state.bookings=[];
      state.clientNotifications=[];
      state.mode=null;
      state.route='welcome';
      state.history=[];
      state.service=null;
      state.professional=null;
      state.date=null;
      state.time=null;
      save();
      close();
      render();
      showToast('Conta da empresa excluída');
    }
  });
}

  overlay.id='quickLogoutModal';
  overlay.className='quick-logout-overlay';
  overlay.innerHTML=`<div class="quick-logout-sheet">

      state.mode=null;
      state.route='welcome';
      state.history=[];
      save();

      return;
    }

    if(state.mode==='client'){
      state.currentClientId='';
      state.clientName='';

      state.mode=null;
      state.route='welcome';
      state.history=[];
      state.selectedCategory='';
      state.clientSearch='';
      save();
      render();
    }
  };

function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1900);}
function setRoute(route,push=true){if(push&&state.route!==route)state.history.push(state.route);state.route=route;save();render();}
function goBack(){state.route=state.history.pop()||(state.mode==='client'?'clientHome':state.mode==='business'?'businessDashboard':'welcome');save();render();}
function clearFlow(){state.service=null;state.professional=null;state.date=null;state.time=null;}
function businessName(){return state.business.name||'Seu negócio';}
function initials(name){return (name||'Reserv').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function slugify(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'meu-negocio';}
function businessSlug(){return state.business.slug||slugify(state.business.name);}
function bookingUrl(){const u=new URL(window.location.href);u.search='';u.hash='';u.searchParams.set('agendar',businessSlug());return u.href;}
function qrImageUrl(){return 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=12&data='+encodeURIComponent(bookingUrl());}
function formatDate(key){return new Date(key+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});}
function row(icon,label,value){return `<div class="summary-row"><div class="summary-icon">${icon}</div><div><div class="label">${label}</div><strong>${value}</strong></div></div>`;}
function field(label,name,type='text',value='',placeholder=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${String(value??'').replaceAll('"','&quot;')}" placeholder="${placeholder}" required></div>`;}

function validClientPin(value){
  return /^\d{4}$/.test(String(value||'').trim());
}
function maskClientWhatsapp(value){
  const d=normalizeClientWhatsapp(value);
  if(d.length<4)return value||'';
  return `••••••${d.slice(-4)}`;
}
function normalizeClientWhatsapp(value){
  return String(value||'').replace(/\D/g,'');
}
function clientIdFromWhatsapp(value){
  const digits=normalizeClientWhatsapp(value);
  return digits?`cli_${digits}`:'';
}
function getCurrentClient(){
  return state.clients.find(c=>c.id===state.currentClientId)||null;
}
function findClientByWhatsapp(value){
  const id=clientIdFromWhatsapp(value);
  return state.clients.find(c=>c.id===id)||null;
}
function upsertClient(name,whatsapp,pin){
  const id=clientIdFromWhatsapp(whatsapp);
  if(!id)return null;
  let client=state.clients.find(c=>c.id===id);
  if(client){
    return client;
  }
  client={
    id,
    name,
    whatsapp,

function normalizeSearchText(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function businessMatchesClientSearch(query){
  const q=normalizeSearchText(query);
  if(!q)return true;

  const searchable=[
    state.business.name,
    state.business.category,
    ...(state.business.categories||[]),
    state.business.address,
    state.business.location,
    ...(state.business.services||[]).flatMap(srv=>[srv.name,srv.description])
  ].filter(Boolean).map(normalizeSearchText);

  return searchable.some(text=>text.includes(q));
}
function businessMatchesHomeCategory(category){
  const selected=String(category||'').trim().toLowerCase();
  const groups={
    'barbearia':['barbearia','barbeiro','barber'],
    'cabelo':['cabelo','salão de beleza','salao de beleza','cabeleireiro','cabeleireira','hair'],
    'unhas':['unhas','manicure','pedicure','nail'],
    'cílios':['cílios','cilios','cílios e sobrancelhas','cilios e sobrancelhas','sobrancelhas','lash','brow'],
    'estética':['estética','estetica','spa','facial','depilação','depilacao']
  };
  const terms=groups[selected]||[selected];
  return businessCategories().some(cat=>{
    const c=String(cat||'').trim().toLowerCase();
    return terms.some(term=>c.includes(term));
  });
}

function categoriesOfBusiness(b){
  return Array.isArray(b?.categories)&&b.categories.length?b.categories:[b?.category].filter(Boolean);
}
function publicBusinessMatches(b,selected,query){
  const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const selectedNorm=norm(selected);
  const q=norm(query);
  const categoryMatch=!selectedNorm||categoriesOfBusiness(b).some(c=>{
    const n=norm(c);
    const groups={
      'barbearia':['barbearia','barbeiro','barber'],
      'cabelo':['cabelo','salao de beleza','cabeleireiro','cabeleireira','hair'],
      'unhas':['unhas','manicure','pedicure','nail'],
      'cilios':['cilios','sobrancelhas','lash','brow'],
      'estetica':['estetica','spa','facial','depilacao']
    };
    const terms=groups[selectedNorm]||[selectedNorm];
    return terms.some(t=>n.includes(t));
  });
  if(!categoryMatch)return false;
  if(!q)return true;
  const searchable=[
    b.name,b.category,...categoriesOfBusiness(b),b.address,b.location,
    ...(b.services||[]).flatMap(x=>[x.name,x.description])
  ].map(norm);
  return searchable.some(x=>x.includes(q));
}

function clientNotificationText(type,b){
  if(type==='confirmed')return `Seu agendamento de ${b.service?.name||'serviço'} foi confirmado para ${formatDate(b.date)} às ${b.time}.`;
  if(type==='cancelled')return `Seu agendamento de ${b.service?.name||'serviço'} foi cancelado.${b.cancelReason?` Motivo: ${b.cancelReason}`:''}`;
  if(type==='rescheduled')return `Seu agendamento de ${b.service?.name||'serviço'} foi reagendado para ${formatDate(b.date)} às ${b.time}.`;
  return 'Houve uma atualização no seu agendamento.';
}
function pushClientNotification(type,b){
  if(!b)return;
  const clientId=b.clientId||clientIdFromWhatsapp(b.clientWhatsapp);
  if(!clientId)return;

  const key=`${clientId}_${type}_${b.createdAt||''}_${b.updatedAt||Date.now()}`;
  if(state.clientNotifications.some(n=>n.key===key))return;

  state.clientNotifications.unshift({
    id:'not_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    key,
    clientId,
    bookingCreatedAt:b.createdAt||0,
    type,
    title:type==='confirmed'?'Agendamento confirmado':type==='cancelled'?'Agendamento cancelado':'Agendamento reagendado',
    message:clientNotificationText(type,b),
    service:b.service?.name||'Serviço',
    date:b.date,
    time:b.time,
    read:false,
    createdAt:Date.now()
  });

  if(state.clientNotifications.length>200)state.clientNotifications.length=200;
}

function initLocationMaps(){
  if(typeof L==='undefined'){
    setTimeout(initLocationMaps,250);
    return;
  }
  document.querySelectorAll('.leaflet-location-map').forEach(el=>{
    if(el.dataset.ready==='1') return;
    const lat=Number(el.dataset.lat),lng=Number(el.dataset.lng);
    if(!Number.isFinite(lat)||!Number.isFinite(lng)) return;
    el.dataset.ready='1';
    const map=L.map(el,{
      zoomControl:true,
      attributionControl:true,
      dragging:true,
      scrollWheelZoom:true,
      doubleClickZoom:true,
      boxZoom:true,
      keyboard:true,
      tap:true,
      touchZoom:true
    }).setView([lat,lng],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'© OpenStreetMap'
    }).addTo(map);
    const pin=L.divIcon({
      className:'reserv-map-pin-wrap',
      html:'<div class="reserv-map-pin"><span></span></div>',
      iconSize:[34,42],
      iconAnchor:[17,38]
    });
    L.marker([lat,lng],{icon:pin,interactive:false}).addTo(map);
    setTimeout(()=>map.invalidateSize(),80);
  });
}

document.addEventListener('submit',e=>{
  if(e.target.id==='clientPinForm'){
    e.preventDefault();
    const fd=new FormData(e.target);
    const c=getCurrentClient();
    if(!c){showToast('Perfil não encontrado');return;}

    const current=(fd.get('currentPin')||'').trim();
    const next=(fd.get('newPin')||'').trim();
    const confirm=(fd.get('confirmNewPin')||'').trim();

    if(!validClientPin(next)){showToast('O novo PIN deve ter 4 dígitos');return;}
    if(next!==confirm){showToast('Os novos PINs não coincidem');return;}

    if(CLOUD_MODE){
      gasCall('changeClientPin',state.sessionToken,current,next).then(()=>{
        e.target.reset();
        showToast('PIN atualizado');
      }).catch(cloudError);
      return;
    }

    if(String(c.pin||'')!==current){showToast('PIN atual incorreto');return;}
    c.pin=next;
    c.updatedAt=Date.now();
    save();
    e.target.reset();
    showToast('PIN atualizado');
    return;
  }

  if(e.target.id==='clientRegisterForm'){
    e.preventDefault();
    const f=e.target,fd=new FormData(f);
    const name=(fd.get('clientName')||'').trim();
    const whatsapp=(fd.get('clientWhatsappRegister')||'').trim();
    const pin=(fd.get('clientPinRegister')||'').trim();
    const confirm=(fd.get('clientPinConfirm')||'').trim();

    if(!name){showToast('Informe seu nome');return;}
    if(normalizeClientWhatsapp(whatsapp).length<10){showToast('Informe um WhatsApp válido');return;}
    if(!validClientPin(pin)){showToast('Crie um PIN de 4 dígitos');return;}
    if(pin!==confirm){showToast('Os PINs não coincidem');return;}

    if(CLOUD_MODE){
      showToast('Criando seu perfil...');
      gasCall('registerClient',{name,whatsapp,pin}).then(async res=>{
        const client=res.client;
        state.sessionToken=res.token;
        state.clients=[...(state.clients||[]).filter(x=>x.id!==client.id),client];
        state.currentClientId=client.id;
        state.clientName=client.name;
        state.clientWhatsapp=client.whatsapp;
        state.mode='client';
        state.businesses=await gasCall('listBusinesses');
        if(state.pendingCompanySlug){
          const target=state.businesses.find(b=>b.slug===state.pendingCompanySlug);
          if(target)state.business=target;
          state.route=target?'clientBusiness':'clientHome';
        }else state.route='clientHome';
        saveLocalOnly();
        render();
        showToast('Perfil criado com sucesso');
      }).catch(cloudError);
      return;
    }

    const existing=findClientByWhatsapp(whatsapp);
    if(existing){showToast('Este WhatsApp já possui um perfil. Use a área de login.');return;}
    const client=upsertClient(name,whatsapp,pin);
    if(!client){showToast('Não foi possível criar seu perfil');return;}
    state.mode='client';
    setRoute('clientHome');
    showToast('Perfil criado com sucesso');
    return;
  }

  if(e.target.id==='clientProfileForm'){
    e.preventDefault();
    const fd=new FormData(e.target);
    const c=getCurrentClient();
    if(!c){showToast('Perfil não encontrado');return;}
    const name=(fd.get('profileClientName')||'').trim();
    const whatsapp=(fd.get('profileClientWhatsapp')||'').trim();
    if(!name){showToast('Informe seu nome');return;}
    if(normalizeClientWhatsapp(whatsapp).length<10){showToast('Informe um WhatsApp válido');return;}

    const newId=clientIdFromWhatsapp(whatsapp);
    const duplicate=state.clients.find(x=>x.id===newId&&x.id!==c.id);
    if(duplicate){showToast('Esse WhatsApp já pertence a outro perfil');return;}

    const oldId=c.id;
    c.id=newId;
    c.name=name;
    c.whatsapp=whatsapp;
    c.updatedAt=Date.now();
    state.currentClientId=newId;
    state.clientName=name;
    state.clientWhatsapp=whatsapp;

    state.bookings.forEach(b=>{
      if(b.clientId===oldId){
        b.clientId=newId;
        b.client=name;
        b.clientWhatsapp=whatsapp;
      }
    });

    save();
    render();
    showToast('Perfil atualizado');
    return;
  }

  if(e.target.id==='profileSettingsForm'){
    e.preventDefault();
    const f=e.target,fd=new FormData(f);
    state.business.name=(fd.get('profileBusinessName')||'').trim()||state.business.name;
    state.business.email=(fd.get('profileEmail')||'').trim();
    state.business.whatsapp=(fd.get('profileWhatsapp')||'').trim();
    state.business.category=(fd.get('profileCategory')||'').trim();
    state.business.description=(fd.get('profileDescription')||'').trim();
    save();
    render();
    showToast('Perfil atualizado');
    return;
  }

  e.preventDefault();const f=e.target,fd=new FormData(f);
  if(f.id==='clientLoginForm'){
    const whatsapp=(fd.get('clientWhatsapp')||'').trim();
    const pin=(fd.get('clientPin')||'').trim();

    if(normalizeClientWhatsapp(whatsapp).length<10){showToast('Informe um WhatsApp válido');return;}
    if(!validClientPin(pin)){showToast('Informe seu PIN de 4 dígitos');return;}

    if(CLOUD_MODE){
      showToast('Entrando...');
      gasCall('clientLogin',whatsapp,pin).then(res=>{
        const client=res.client;
        state.sessionToken=res.token;
        state.clients=[...(state.clients||[]).filter(x=>x.id!==client.id),client];
        state.currentClientId=client.id;
        state.clientName=client.name;
        state.clientWhatsapp=client.whatsapp;
        state.bookings=res.bookings||[];
        state.clientNotifications=res.notifications||[];
        state.businesses=res.businesses||[];
        state.mode='client';

        if(state.pendingCompanySlug){
          const target=state.businesses.find(b=>b.slug===state.pendingCompanySlug);
          if(target)state.business=target;
          state.route=target?'clientBusiness':'clientHome';
        }else state.route='clientHome';

        saveLocalOnly();
        render();
        showToast(`Bem-vindo de volta, ${client.name}`);
      }).catch(cloudError);
      return;
    }

    const existing=findClientByWhatsapp(whatsapp);
    if(!existing||String(existing.pin)!==String(pin)){showToast('WhatsApp ou PIN incorretos');return;}
    state.currentClientId=existing.id;
    state.clientName=existing.name;
    state.clientWhatsapp=existing.whatsapp;
    save();
    state.mode='client';
    setRoute('clientHome');
    showToast(`Bem-vindo de volta, ${existing.name}`);
    return;
  }
  if(f.id==='businessLoginForm'){
    const email=(fd.get('email')||'').trim().toLowerCase();
    const rawPassword=(fd.get('loginPassword')||'').trim();

    if(CLOUD_MODE){
      showToast('Entrando no painel...');
      gasCall('businessLogin',email,rawPassword).then(res=>{
        state.sessionToken=res.token;
        state.business=res.business;
        state.bookings=res.bookings||[];
        state.mode='business';
        state.route='businessDashboard';

        const remember=fd.get('rememberLogin')==='on';
        setRememberAccessPreference(remember);
        if(remember)saveBusinessSession();
        else try{localStorage.removeItem('reserv_business_session');}catch(e){}

        saveLocalOnly();
        render();
        showToast('Painel carregado');
      }).catch(cloudError);
      return;
    }

    const loginPassword=rawPassword.replace(/\D/g,'');
    const savedEmail=(state.business.email||'').trim().toLowerCase();
    const savedPassword=(state.business.whatsapp||'').replace(/\D/g,'');
    if(!state.business.setupDone){showToast('Nenhuma empresa cadastrada ainda');return;}
    if(email!==savedEmail||loginPassword!==savedPassword){showToast('E-mail ou senha incorretos');return;}
    state.mode='business';
    setRoute('businessDashboard');
    return;
  }
  if(f.id==='businessSetupForm'){
    const email=(fd.get('email')||'').trim();
    const whatsapp=(fd.get('whatsapp')||'').trim();
    const categories=fd.getAll('businessCategories').filter(Boolean);
    const custom=(fd.get('customCategory')||'').trim();

    if(!email){showToast('Informe o e-mail da empresa');return;}
    if(!whatsapp){showToast('Informe o WhatsApp da empresa');return;}
    if(custom)categories.push(custom);
    if(!categories.length){showToast('Selecione pelo menos uma categoria');return;}

    state.business={...state.business,
      name:fd.get('name'),
      categories:[...new Set(categories)],
      category:categories[0],
      whatsapp,
      email,
      address:fd.get('address'),
      location:fd.get('location'),
      latitude:fd.get('latitude')||state.business.latitude,
      longitude:fd.get('longitude')||state.business.longitude,
      description:fd.get('description'),
      slug:slugify(fd.get('name'))
    };
    save();
    setRoute('setupSchedule');
    return;
  }
  if(f.id==='scheduleSetupForm'){const days=fd.getAll('workDays');if(!days.length){showToast('Selecione pelo menos um dia de atendimento');return;}state.business.workDays=days;state.business.open=fd.get('open');state.business.close=fd.get('close');const intervalChoice=fd.get('interval');
if(intervalChoice==='custom'){
  const customValue=Number(fd.get('customIntervalValue'));
  const customUnit=fd.get('customIntervalUnit')||'minutes';
  if(!customValue||customValue<=0){showToast('Informe um intervalo personalizado válido');return;}
  state.business.intervalCustomValue=customValue;
  state.business.intervalCustomUnit=customUnit;
  state.business.interval=customUnit==='hours'?customValue*60:customValue;
}else{
  state.business.interval=Number(intervalChoice);
  state.business.intervalCustomValue='';
  state.business.intervalCustomUnit='minutes';
}
const box=document.getElementById('dailySchedules');const custom=box?.classList.contains('show');state.business.daySchedules={};if(custom){days.forEach(d=>{state.business.daySchedules[d]={open:fd.get('open_'+d)||state.business.open,close:fd.get('close_'+d)||state.business.close};});}save();setRoute('setupServices');return;}
  if(f.id==='serviceSetupForm'||f.id==='businessAddService'){const name=(fd.get('name')||'').trim();if(!name){showToast('Informe o nome do serviço');return;}const durationValue=Number(fd.get('durationValue')||0);const durationUnit=fd.get('durationUnit')||'minutes';if(!durationValue||durationValue<=0){showToast('Informe uma duração válida');return;}const duration=durationUnit==='hours'?durationValue*60:durationValue;state.business.services.push({name,description:(fd.get('description')||'').trim(),duration,durationValue,durationUnit,price:Number(fd.get('price')||0),photo:fd.get('servicePhoto')||'',icon:'✨'});
  const ok=save();
  render();
  showToast(ok?'Serviço adicionado':'Serviço adicionado nesta sessão');
  return;}
  
  if(f.id==='professionalSetupForm'||f.id==='businessAddProfessional'){const name=fd.get('name').trim();if(!name)return;const workDays=fd.getAll('professionalWorkDays');if(!workDays.length){showToast('Selecione pelo menos um dia de atendimento para o profissional');return;}const open=fd.get('professionalOpen')||state.business.open;const close=fd.get('professionalClose')||state.business.close;if(open>=close){showToast('O horário final deve ser maior que o inicial');return;}state.business.professionals.push({name,specialty:fd.get('specialty'),photo:fd.get('professionalPhoto')||'',workDays,open,close});save();showToast('Profissional adicionado');render();return;}
  if(f.id==='businessSettingsForm'){['name','whatsapp','email','address','location','open','close'].forEach(k=>state.business[k]=fd.get(k));state.business.latitude=fd.get('latitude')||state.business.latitude;state.business.longitude=fd.get('longitude')||state.business.longitude;state.business.slug=slugify(fd.get('slug')||state.business.name);save();showToast('Alterações salvas');render();return;}
});



/* ===== RESERV GITHUB + APPS SCRIPT FETCH DIRETO ===== */
(function(){
  try{
    load();
    render();

    /* Sincroniza depois sem bloquear o carregamento */
    setTimeout(()=>{
      cloudRestore()
        .then(()=>{render();return cloudRefreshLiveData(false);})
        .catch(err=>console.warn('Reserv backend:',err));
    },100);

    setInterval(()=>cloudRefreshLiveData(true),60000);

    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden)cloudRefreshLiveData(true);
    });
  }catch(err){
    console.error('Reserv fatal:',err);
    const el=document.getElementById('app');
    if(el){
      el.innerHTML='<div style="padding:24px;font-family:Arial,sans-serif">'
        +'<h2>Erro ao iniciar o Reserv</h2>'
        +'<pre style="white-space:pre-wrap">'+String(err&&(err.stack||err.message)||err).replace(/</g,'&lt;')+'</pre></div>';
    }
  }
})();

</script>
